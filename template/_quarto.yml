project:
  type: officequarto

format:
  docx:
    reference-doc: original.docx
    officequarto:
      keep-rendered: true
      styles:
        body: "Fließtext ACME"
      lists:
        # Array = one style per nesting level (index 0 = top level), tested via the
        # officedown alias ul_style, see README "Lists" and dev/spike-notes.md Spike O
        ul_style: ["Aufzählung ACME", "Aufzählung ACME 2", "Aufzählung ACME 3"]
        list-number: ["Nummerierung ACME", "Nummerierung ACME 2", "Nummerierung ACME 3"]
        # deliberately stays scalar - tests backward compatibility + clamping onto the
        # single configured style at deeper nesting, see report.qmd "Varianten"
        list-letter: "Buchstabierung ACME"
      pandoc-styles:
        code-block: "Code ACME"
      tables:
        style: "Tabelle ACME"
        layout: fixed
        tables_width: 0.8         # officedown alias for width, see README
        conditional:
          first-row: true
          tables_conditional_last_row: true   # officedown alias for last-row
          band-rows: false
          tables_conditional_no_vband: false  # officedown alias for band-columns (inverted polarity -> true)
        caption:
          style: "Beschriftung ACME"
          prefix: "Tab. "
          tables_caption_sep: " -- "          # officedown alias for separator
          number-bold: true
          above: false                        # overrides Pandoc's default (tables: caption above)
      plots:
        style: "Abbildung ACME"
        plots_align: right                    # officedown alias for align
        caption:
          plots_caption_style: "Abbildungsbeschriftung ACME"   # officedown alias for style
          prefix: "Abb. "
          separator: " | "
          plots_caption_bold: false           # officedown alias for number-bold
          plots_topcaption: true               # officedown alias for above (overrides Pandoc's default: figures below)
      style-map:
        "Titel ACME": [Title]
        "Fußnotentext ACME": [FootnoteText]
      page:
        size:
          width: 11.7
          height: 8.3
          page_size_orient: landscape   # officedown alias for orientation
        margins:
          top: 0.75
          page_margins_bottom: 0.75     # officedown alias for bottom
          left: 1
          right: 1
          header: 0.4
          footer: 0.4
          gutter: 0
      crossref:
        reference_num: false   # officedown alias for numbered
